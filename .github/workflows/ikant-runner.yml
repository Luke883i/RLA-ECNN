name: iKant runner tests

# DEC-0009: deterministic fetch + verify + trace reference runner.
# Runs the dependency-free Node.js integration tests for Operation/runner/, which
# exercise the manifest-driven fetch + verify + trace flow and the
# DUE-CORPUS-FETCH fixture. No npm install: the runner uses only the Node.js
# standard library.

on:
  push:
    branches: ["**"]
    paths:
      - "Operation/runner/**"
      - "Operation/MANIFEST.json"
      - "Operation/iKANT_PROMPT.md"
      - ".github/workflows/ikant-runner.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "Operation/runner/**"
      - "Operation/MANIFEST.json"
      - "Operation/iKANT_PROMPT.md"
      - ".github/workflows/ikant-runner.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run iKant runner tests
        # Let the shell expand the glob so the gate is portable across Node
        # versions (Node < 21 does not expand glob patterns inside --test).
        run: node --test Operation/runner/test/*.test.js
